<div class="container my-4">
 
  <!-- Certificates Table -->
  <div class="card p-3 shadow-sm">
    <h4>Certificate List</h4>

    <div class="table-responsive">
      <table class="table table-striped table-hover align-middle">

        <thead class="table-dark">
          <tr>
            <th>Donor ID</th>
            <th>Name</th>
            <th>Blood Group</th>
            <th>Donation Date</th>
            <th>Certificate ID</th>
            <th>Verified</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let cert of certificates">

            <td>{{ cert.donorId }}</td>
            <td>{{ cert.donorName }}</td>
            <td>{{ cert.bloodGroup }}</td>
            <td>{{ cert.donationDate }}</td>
            <td>{{ cert.certificateId }}</td>

            <td>
              <span class="badge"
                [ngClass]="cert.verified ? 'bg-success' : 'bg-warning text-dark'">
                {{ cert.verified ? 'Verified' : 'Not Verified' }}
              </span>
            </td>

            <td>
              <!-- Verify Button -->
              <button class="btn btn-success btn-sm"
                [disabled]="cert.verified"
                (click)="verifyCertificate(cert)">
                Verify
              </button>

              <!-- Download Button -->
           <button class="btn btn-info btn-sm ms-2"
  [disabled]="!cert.verified"
  (click)="downloadCertificate(cert.donorId)">
  Download
</button>
            </td>

          </tr>
        </tbody>

      </table>
    </div>
  </div>
</div>
