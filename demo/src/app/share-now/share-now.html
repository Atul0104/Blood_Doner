<div class="awareness-container">
  <h2 class="text-center mb-4">📣 Spread Awareness</h2>
  <p class="text-center mb-4">
    Share our mission with your friends and help raise awareness about blood donation. Every drop matters!
  </p>

  <form [formGroup]="awarenessForm" (ngSubmit)="onSubmit()">
    <div class="form-group mb-3">
      <label>Your Name</label>
      <input type="text" formControlName="yourName" class="form-control" placeholder="Enter your name">
    </div>

    <div class="form-group mb-3">
      <label>Friend's Email</label>
      <input type="email" formControlName="friendEmail" class="form-control" placeholder="Enter friend's email">
    </div>

    <div class="form-group mb-4">
      <label>Your Message</label>
      <textarea formControlName="customMessage" class="form-control" rows="4"
        placeholder="Write a short message to inspire them..."></textarea>
    </div>

    <button type="submit" class="btn btn-danger w-100">📤Share</button>
  </form>
</div>
