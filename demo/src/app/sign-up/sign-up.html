<div class="donor-container">
  <h2 class="text-center mb-3">🩸 Become a Donor</h2>
  <p class="text-center mb-4">Register today to donate blood and give someone the gift of life.</p>

  <form [formGroup]="donorForm" (ngSubmit)="onSubmit()">
    <div class="form-group mb-3">
      <label>Full Name</label>
      <input type="text" class="form-control" formControlName="name" placeholder="Your name" />
    </div>

    <div class="form-group mb-3">
      <label>Age</label>
      <input type="number" class="form-control" formControlName="age" placeholder="Your age" />
    </div>

    <div class="form-group mb-3">
      <label>Gender</label>
      <select class="form-control" formControlName="gender">
        <option value="" disabled>Select Gender</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>
    </div>

    <div class="form-group mb-3">
      <label>Blood Group</label>
      <select class="form-control" formControlName="bloodGroup">
        <option value="" disabled>Select Blood Group</option>
        <option *ngFor="let bg of ['A+', 'A-', 'B+', 'B-', 'AB+', 'AB-', 'O+', 'O-']">{{ bg }}</option>
      </select>
    </div>

    <div class="form-group mb-3">
      <label>Phone Number</label>
      <input type="tel" class="form-control" formControlName="phone" placeholder="10-digit phone number" />
    </div>

    <div class="form-group mb-3">
      <label>Email</label>
      <input type="email" class="form-control" formControlName="email" placeholder="Your email address" />
    </div>

    <div class="form-group mb-4">
      <label>Location</label>
      <input type="text" class="form-control" formControlName="location" placeholder="Your city or area" />
    </div>

    <button type="submit" class="btn btn-danger w-100">❤️ Register as Donor</button>
  </form>
</div>
