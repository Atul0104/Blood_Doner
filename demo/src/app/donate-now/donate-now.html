<div class="container-fluid min-vh-100 d-flex align-items-center bg-light">
  <div class="container">
    <div class="row shadow-lg overflow-hidden">


      <div class="col-lg-6 d-flex flex-column justify-content-center align-items-center text-white p-4"
        style="background: linear-gradient(rgba(138,112,141,0.85), rgba(12,12,12,0.85)), url('/donate.png') center/cover;">
        <h2 class="fw-bold text-center">Be a Hero, Donate Blood ❤️</h2>
        <p class="text-center mt-3 fs-5">
          Every drop you donate can save up to three lives.  
          Join our community of life savers today.
        </p>
        <ul class="list-unstyled mt-4 fs-6">
          <li>✔ Quick & Safe Process</li>
          <li>✔ Free Health Checkup</li>
          <li>✔ Help Your Community</li>
        </ul>
      </div>


      <div class="col-lg-6 d-flex align-items-center justify-content-center"
        style="background: linear-gradient(135deg, var(--nude), var(--rose-smoke));">
        <div class="p-4 w-100" style="max-width: 500px; background: rgba(255,255,255,0.85); backdrop-filter: blur(10px); box-shadow: 0 8px 20px rgba(0,0,0,0.1);">
          <h3 class="text-danger fw-bold mb-4 text-center">Blood Donation Form</h3>

          <form [formGroup]="donateForm" (ngSubmit)="checkEligibility()">


            <div class="mb-3">
              <label class="form-label fw-semibold">Full Name</label>
              <input type="text" class="form-control shadow-sm" formControlName="name">
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Email</label>
              <input type="email" class="form-control shadow-sm" formControlName="email">
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Age</label>
              <input type="number" class="form-control shadow-sm" formControlName="age">
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Weight (kg)</label>
              <input type="number" class="form-control shadow-sm" formControlName="weight">
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Blood Group</label>
              <select class="form-select shadow-sm" formControlName="bloodGroup">
                <option disabled selected>Select</option>
                <option *ngFor="let bg of bloodGroups" [value]="bg">{{ bg }}</option>
              </select>
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold">Are you in good health?</label>
              <select class="form-select shadow-sm" formControlName="healthStatus">
                <option disabled selected>Select</option>
                <option value="yes">Yes</option>
                <option value="no">No</option>
              </select>
            </div>

            <div class="text-center">
              <button type="submit" class="btn btn-danger px-5 py-2 shadow-sm fs-5">
                Check Eligibility
              </button>
            </div>

            <div class="mt-4 text-center" *ngIf="message">
              <div class="alert shadow-sm"
                [ngClass]="{'alert-success': isEligible, 'alert-danger': !isEligible}">
                {{ message }}
              </div>
            </div>

          </form>
        </div>
      </div>

    </div>
  </div>
</div>
